      <path d="M42 18h36" stroke="#fff3bf" stroke-opacity="0.9" stroke-width="6" stroke-linecap="round"/>
      <rect x="22" y="44" width="62" height="12" rx="6" fill="#fff7d6" opacity="0.95"/>
      <rect x="22" y="66" width="62" height="12" rx="6" fill="#fff7d6" opacity="0.8"/>
      <rect x="22" y="88" width="40" height="12" rx="6" fill="#fff7d6" opacity="0.7"/>
